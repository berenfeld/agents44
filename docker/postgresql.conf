# Agents44 PostgreSQL — loaded via config_file, not written at runtime.
data_directory = '/var/lib/psql/data'
hba_file = '/opt/agents44/docker/pg_hba.conf'
ident_file = '/var/lib/psql/data/pg_ident.conf'
unix_socket_directories = '/var/run/postgresql'
listen_addresses = '*'
port = 5432
logging_collector = off
log_destination = 'stderr'
