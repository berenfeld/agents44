name: Build and push image

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set app version
        id: version
        run: echo "value=$(bash scripts/git-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AGENTS44_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AGENTS44_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AGENTS44_AWS_REGION || 'eu-central-1' }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPO: ${{ secrets.AGENTS44_ECR_REPOSITORY }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$REPO" ]; then
            echo "Set GitHub secret AGENTS44_ECR_REPOSITORY (repo name or full ECR URI)" >&2
            exit 1
          fi
          if [[ "$REPO" == *".amazonaws.com/"* ]]; then
            IMAGE="$REPO"
          else
            if [ -z "$REGISTRY" ]; then
              echo "ECR login did not return a registry — check AGENTS44_AWS_REGION and credentials" >&2
              exit 1
            fi
            IMAGE="$REGISTRY/$REPO"
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            # latest = last successful build from main only
            if [ "$BRANCH" = "main" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
